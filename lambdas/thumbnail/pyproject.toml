[project]
name = "aussie-ecolens-thumbnail"
version = "0.1.0"
description = "AWS Lambda that generates compressed, aspect-ratio-preserving image thumbnails on upload"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Arsh Bansal" },
]
license = { text = "MIT" }
keywords = ["aws", "lambda", "s3", "eventbridge", "thumbnails", "pillow"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = [
    "boto3>=1.43.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "structlog>=25.5.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aussie_ecolens_thumbnail"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
