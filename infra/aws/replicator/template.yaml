AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Aussie EcoLens - Replicator Lambda (CQRS cross-cloud replication).
  Reads the shared files table's DynamoDB stream and mirrors every change
  into Azure Cosmos DB (the read side the query API serves from):
  INSERT/MODIFY -> upsert, REMOVE -> delete. Keeps the Cosmos read model
  consistent with the DynamoDB system of record.

  Creates the Lambda, its least-privilege role, log group, and the stream
  event source mapping. The DynamoDB table (and its stream) is owned by the
  data/API stack and referenced by ARN. Cosmos connection details are
  passed as NoEcho parameters (sourced from a secret at deploy time).

Parameters:
  ProjectPrefix:
    Type: String
    Default: aussie-ecolens
    Description: Prefix for resource names (must match IAM policy scoping).

  FilesTableStreamArn:
    Type: String
    Description: >
      DynamoDB Streams ARN of the shared files table (Output of the
      data/API stack). The replicator's event source. Required.

  CosmosEndpoint:
    Type: String
    Description: Cosmos DB account URI (e.g. https://<acct>.documents.azure.com:443/).

  CosmosKey:
    Type: String
    NoEcho: true
    Description: Cosmos DB account key (secret). Passed at deploy, never logged.

  CosmosDatabase:
    Type: String
    Default: aussie-ecolens
    Description: Cosmos database name.

  CosmosContainer:
    Type: String
    Default: files
    Description: Cosmos container name (partition key /user_id).

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for the Lambda log group.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architectures:
      - arm64

Resources:

  ReplicatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectPrefix}-replicator"
      RetentionInDays: !Ref LogRetentionDays

  ReplicatorFunction:
    Type: AWS::Serverless::Function
    DependsOn: ReplicatorLogGroup
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-replicator"
      CodeUri: ../
      Handler: aussie_ecolens_replicator.handler.lambda_handler
      Environment:
        Variables:
          # AWS_REGION is reserved + auto-set by the runtime.
          COSMOS_ENDPOINT: !Ref CosmosEndpoint
          COSMOS_KEY: !Ref CosmosKey
          COSMOS_DATABASE: !Ref CosmosDatabase
          COSMOS_CONTAINER: !Ref CosmosContainer
          LOG_LEVEL: INFO
          DRY_RUN: "false"
      Policies:
        # Least-privilege (assignment 1.3): read the specific DDB stream,
        # write own logs. Cosmos auth is via the key (not IAM). No wildcards.
        - Statement:
            - Sid: ReadFilesTableStream
              Effect: Allow
              Action:
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams
              Resource: !Ref FilesTableStreamArn
      Events:
        FilesTableStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref FilesTableStreamArn
            StartingPosition: LATEST
            BatchSize: 25
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ReplicatorFunctionArn:
    Description: ARN of the replicator Lambda.
    Value: !GetAtt ReplicatorFunction.Arn
