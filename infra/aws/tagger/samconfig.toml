# SAM CLI configuration for the Tagger stack.
# Lets `sam deploy` run without re-answering the guided prompts each time.
#
# IMPORTANT: ImageUri is intentionally NOT pinned here because it changes
# with each image tag. Pass it at deploy time:
#
#   sam deploy --parameter-overrides \
#     ImageUri=247622885425.dkr.ecr.ap-southeast-2.amazonaws.com/aussie-ecolens-tagger:dev
#
# (see infra/README.md for the full deploy workflow)

version = 0.1

[default.deploy.parameters]
stack_name = "aussie-ecolens-tagger"
region = "ap-southeast-2"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
disable_rollback = false

[default.delete.parameters]
stack_name = "aussie-ecolens-tagger"
region = "ap-southeast-2"