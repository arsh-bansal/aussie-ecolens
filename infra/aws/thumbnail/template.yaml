AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Aussie EcoLens - Thumbnail Lambda (image processing, assignment 2.1.2).
  On image upload the function generates a compressed, aspect-ratio-preserving
  JPEG thumbnail and stores it at the deterministic key <sha>.jpg in the
  thumbnails bucket. The tagger derives the same key for an image's
  thumbnail_url, so no DB write or cross-Lambda coordination happens here.

  Triggered via EventBridge (the uploads bucket emits "Object Created" to the
  default bus; this stack owns a rule filtered to image suffixes). Videos are
  handled by the video splitter, not this function. This stack creates ONLY
  the thumbnail function, its least-privilege role, its log group, and the
  EventBridge rule; the buckets are owned by the infra stack and referenced
  by name.

Parameters:
  ProjectPrefix:
    Type: String
    Default: aussie-ecolens
    Description: Prefix for resource names (must match IAM policy scoping).

  UploadsBucketName:
    Type: String
    Default: ""
    Description: >
      Name of the existing uploads bucket. Defaults to
      <prefix>-uploads-<account> when left blank.

  ThumbnailsBucketName:
    Type: String
    Default: ""
    Description: >
      Name of the existing thumbnails bucket. Defaults to
      <prefix>-thumbnails-<account> when left blank.

  MaxEdge:
    Type: String
    Default: "320"
    Description: Longest-edge size (px) of the thumbnail (coerced to int).

  JpegQuality:
    Type: String
    Default: "80"
    Description: JPEG compression quality 1-95 (coerced to int).

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for the Lambda log group.

Conditions:
  UploadsNameProvided: !Not [!Equals [!Ref UploadsBucketName, ""]]
  ThumbnailsNameProvided: !Not [!Equals [!Ref ThumbnailsBucketName, ""]]

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - arm64

Resources:
  ThumbnailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectPrefix}-thumbnail"
      RetentionInDays: !Ref LogRetentionDays

  ThumbnailFunction:
    Type: AWS::Serverless::Function
    DependsOn: ThumbnailLogGroup
    Metadata:
      # sam build packages the code + pip-installs requirements.txt (Pillow).
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-thumbnail"
      CodeUri: ../../../lambdas/thumbnail/src
      Handler: aussie_ecolens_thumbnail.handler.lambda_handler
      Environment:
        Variables:
          # AWS_REGION is reserved + auto-set by the runtime.
          THUMBNAILS_BUCKET: !If
            - ThumbnailsNameProvided
            - !Ref ThumbnailsBucketName
            - !Sub "${ProjectPrefix}-thumbnails-${AWS::AccountId}"
          MAX_EDGE: !Ref MaxEdge
          JPEG_QUALITY: !Ref JpegQuality
          LOG_LEVEL: INFO
          DRY_RUN: "false"
      Policies:
        # Least-privilege (assignment 1.3): read uploads, write thumbnails,
        # write own logs. No wildcards.
        - Statement:
            - Sid: ReadUploads
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !If
                    - UploadsNameProvided
                    - !Ref UploadsBucketName
                    - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"
            - Sid: WriteThumbnails
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !If
                    - ThumbnailsNameProvided
                    - !Ref ThumbnailsBucketName
                    - !Sub "${ProjectPrefix}-thumbnails-${AWS::AccountId}"
      Events:
        # EventBridge rule on the default bus, matching S3 "Object Created"
        # events from the uploads bucket whose key ends in an image suffix.
        # SAM creates the AWS::Events::Rule + the Lambda invoke permission.
        # Videos do not match (handled by the video splitter's own rule).
        ImageUploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - "Object Created"
              detail:
                bucket:
                  name:
                    - !If
                      - UploadsNameProvided
                      - !Ref UploadsBucketName
                      - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"
                object:
                  key:
                    - suffix: ".jpg"
                    - suffix: ".jpeg"
                    - suffix: ".JPG"
                    - suffix: ".JPEG"
                    - suffix: ".png"
                    - suffix: ".PNG"
                    - suffix: ".webp"
                    - suffix: ".gif"

Outputs:
  ThumbnailFunctionArn:
    Description: ARN of the thumbnail Lambda.
    Value: !GetAtt ThumbnailFunction.Arn

  ThumbnailFunctionName:
    Description: Name of the thumbnail Lambda.
    Value: !Ref ThumbnailFunction

  ReferencedThumbnailsBucket:
    Description: Bucket where thumbnails are written.
    Value: !If
      - ThumbnailsNameProvided
      - !Ref ThumbnailsBucketName
      - !Sub "${ProjectPrefix}-thumbnails-${AWS::AccountId}"
