[project]
name = "aussie-ecolens-tagger"
version = "0.1.0"
description = "AWS Lambda containerized image+video species tagging for Aussie EcoLens"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Arsh Bansal" },
]
license = { text = "MIT" }
keywords = ["aws", "lambda", "ml", "wildlife", "megadetector", "speciesnet"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = [
    "boto3>=1.43.12",
    "megadetector>=10.0.20",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
