AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Aussie EcoLens — Cognito User Pool + App Client. Owned by P1 (Auth).
  Outputs are pasted into frontend/.env.local.

Parameters:
  AppName:
    Type: String
    Default: aussie-ecolens
    Description: Prefix used for the User Pool and App Client names.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AppName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
        - Name: given_name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: family_name
          AttributeDataType: String
          Mutable: true
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      MfaConfiguration: "OFF"
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Verify your Aussie EcoLens account"
        EmailMessage: "Your verification code is {####}"

  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      EnableTokenRevocation: true
      SupportedIdentityProviders:
        - COGNITO

Outputs:
  UserPoolId:
    Description: Paste into VITE_COGNITO_USER_POOL_ID
    Value: !Ref UserPool
  AppClientId:
    Description: Paste into VITE_COGNITO_CLIENT_ID
    Value: !Ref AppClient
  Region:
    Description: Paste into VITE_AWS_REGION
    Value: !Ref AWS::Region
