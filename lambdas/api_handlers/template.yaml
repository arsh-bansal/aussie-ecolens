AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Aussie EcoLens — Query API (Rachana)
  Read side of the CQRS stack: Flask/Lambda querying Azure Cosmos DB.
  Fronted by an HTTP API with a Cognito JWT authorizer (unauthenticated
  requests are rejected at the gateway, before reaching the Lambda) and a
  single {proxy+} catch-all route so Flask owns path routing internally.

Parameters:
  AppName:
    Type: String
    Default: aussie-ecolens
  CosmosEndpoint:
    Type: String
  CosmosKey:
    Type: String
    NoEcho: true
  CosmosDatabase:
    Type: String
    Default: aussie-ecolens
  CosmosContainer:
    Type: String
    Default: files
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  TaggerLambdaName:
    Type: String
    Description: Name of Arsh's tag-only Lambda for /search/by-file (2.2.3).
    Default: "aussie-ecolens-query-tagger"
  SnsTopicArn:
    Type: String
    Description: >
      ARN of the tag-notifications SNS topic (created by the notifier stack).
      /tags/subscribe adds the user's email to this topic with a per-tag
      filter policy (2.3.3).
    Default: "arn:aws:sns:ap-southeast-2:247622885425:aussie-ecolens-tag-notifications"

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        COSMOS_ENDPOINT: !Ref CosmosEndpoint
        COSMOS_KEY: !Ref CosmosKey
        COSMOS_DATABASE: !Ref CosmosDatabase
        COSMOS_CONTAINER: !Ref CosmosContainer
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        AWS_REGION_NAME: !Ref AWS::Region
        S3_BUCKET_NAME: aussie-ecolens-uploads-247622885425
        TAGGER_LAMBDA_NAME: !Ref TaggerLambdaName
        DYNAMODB_TABLE: aussie-ecolens-files
        SNS_TOPIC_ARN: !Ref SnsTopicArn
        # Must match the MessageAttribute the Notifier publishes on, so the
        # subscribe filter policy actually matches detections.
        SPECIES_ATTRIBUTE: species

Resources:
  QueryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      # Cognito JWT authorizer: requests must carry a valid IdToken/AccessToken
      # from this user pool. Unauthenticated calls are rejected at the gateway.
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}"
              audience:
                - !Ref CognitoClientId
        DefaultAuthorizer: CognitoJwt
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "DELETE", "OPTIONS"]
        AllowHeaders: ["Authorization", "Content-Type"]

  QueryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AppName}-query-api"
      Timeout: 120
      MemorySize: 1024
      CodeUri: ./
      Handler: lambda_handler.handler
      Policies:
        - S3CrudPolicy:
            BucketName: aussie-ecolens-uploads-247622885425
        # delete also removes the thumbnail, which lives in a separate bucket
        - S3CrudPolicy:
            BucketName: aussie-ecolens-thumbnails-247622885425
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TaggerLambdaName}"
        # Manual tag-edit + delete write to the DynamoDB system of record
        # (the Replicator then mirrors the change to Cosmos via the stream).
        - DynamoDBCrudPolicy:
            TableName: aussie-ecolens-files
        # /tags/subscribe adds an email subscription (with a filter policy) to
        # the tag-notifications topic. Least privilege: subscribe + list only.
        - Statement:
            - Effect: Allow
              Action:
                - sns:Subscribe
                - sns:ListSubscriptionsByTopic
              Resource: !Ref SnsTopicArn
            # Get/SetSubscriptionAttributes act on the subscription ARN, which
            # SNS does not support scoping by topic, so these need Resource "*".
            # Used to widen a user's existing filter policy when they add a tag.
            - Effect: Allow
              Action:
                - sns:GetSubscriptionAttributes
                - sns:SetSubscriptionAttributes
              Resource: "*"
      Events:
        # Single catch-all: every path + method forwards to Flask, which owns
        # the real routing (/search/tags, /search/species, /search/by-thumbnail,
        # /search/by-file, /tags/modify, /files/delete, ...). No template<->Flask
        # path drift. The default Cognito authorizer applies to this route.
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueryApi
            Path: /{proxy+}
            Method: ANY
        # CORS preflight: browsers send an unauthenticated OPTIONS before any
        # cross-origin POST with an Authorization header. This explicit OPTIONS
        # route has NO authorizer, so preflight returns 200 (handled by Flask /
        # gateway CORS) instead of 401. It's more specific than ANY for OPTIONS,
        # so it wins; GET/POST/DELETE still go through the authorized ANY route.
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref QueryApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

Outputs:
  QueryApiUrl:
    Description: Base URL of the Query API (give this to the frontend).
    Value: !Sub "https://${QueryApi}.execute-api.${AWS::Region}.amazonaws.com"
