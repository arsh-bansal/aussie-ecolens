AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Aussie EcoLens - Tagger (write path) + Query-Tagger Lambdas. One container
  image, two entry points: the tagger is triggered by S3 uploads via
  EventBridge and writes species tags to the shared DynamoDB table; the
  query-tagger is invoked synchronously by the query API for
  find-by-uploaded-file (2.2.3) and persists nothing. Models lazy-load from S3
  at cold start (4.1). This stack creates ONLY tagger-specific resources plus
  the EventBridge rule routing upload events to the tagger; the S3 buckets and
  DynamoDB table are owned by other stacks and referenced by name. The trigger
  uses EventBridge (not a direct bucket notification) to decouple consumers
  from the bucket's single notification slot; bucket-side EventBridge
  enablement belongs in the infra stack that owns the bucket.

Parameters:
  ProjectPrefix:
    Type: String
    Default: aussie-ecolens
    Description: Prefix for resource names (must match IAM policy scoping).

  ImageUri:
    Type: String
    Description: >
      Full ECR image URI, e.g.
      247622885425.dkr.ecr.ap-southeast-2.amazonaws.com/aussie-ecolens-tagger:dev

  UploadsBucketName:
    Type: String
    Default: ""
    Description: >
      Name of the existing uploads bucket (aussie-ecolens-infra stack).
      Defaults to <prefix>-uploads-<account> when left blank.

  ModelsBucketName:
    Type: String
    Default: ""
    Description: >
      Name of the existing models bucket (aussie-ecolens-infra stack).
      Defaults to <prefix>-models-<account> when left blank.

  FilesTableName:
    Type: String
    Default: aussie-ecolens-files
    Description: >
      Name of the existing shared DynamoDB table (owned by the data/API
      stack). The tagger writes tag records here; it does NOT create it.

  MegadetectorS3Key:
    Type: String
    Default: megadetector/v5a/mdv5a.pt
    Description: S3 key of the MegaDetector model in the models bucket.

  SpeciesnetS3Key:
    Type: String
    Default: speciesnet/v1/model.pt
    Description: S3 key of the SpeciesNet model in the models bucket.

  DetectionThreshold:
    Type: String
    Default: "0.4"
    Description: MegaDetector confidence threshold (string; coerced to float).

  SpeciesThreshold:
    Type: String
    Default: "0.4"
    Description: SpeciesNet confidence threshold (string; coerced to float).

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for the Lambda log group.

  MemorySize:
    Type: Number
    Default: 3008
    MinValue: 128
    MaxValue: 3008
    Description: >
      Lambda memory (MB). Capped at 3008 - the default per-account limit
      until a quota increase is requested. CPU scales with memory, so this
      is also the max-CPU setting at the default quota.

Conditions:
  UploadsNameProvided: !Not [!Equals [!Ref UploadsBucketName, ""]]
  ModelsNameProvided: !Not [!Equals [!Ref ModelsBucketName, ""]]

Globals:
  Function:
    Timeout: 120
    MemorySize: !Ref MemorySize
    Architectures:
      - x86_64

Resources:
  # CloudWatch Logs group, explicit retention. Named to match the function
  # so the Lambda writes here automatically.
  TaggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectPrefix}-tagger"
      RetentionInDays: !Ref LogRetentionDays

  # The Tagger Lambda. Container image from ECR. The S3 trigger is wired via
  # EventBridge (see UploadsArrivalRule below), not a direct bucket
  # notification - the bucket lives in another stack and EventBridge keeps the
  # consumers decoupled.
  TaggerFunction:
    Type: AWS::Serverless::Function
    DependsOn: TaggerLogGroup
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-tagger"
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - aussie_ecolens_tagger.handler.lambda_handler
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          # AWS_REGION is reserved + auto-set by the Lambda runtime;
          # TaggerSettings.aws_region reads it, so it is not set here.
          UPLOADS_BUCKET: !If
            - UploadsNameProvided
            - !Ref UploadsBucketName
            - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"
          MODELS_BUCKET: !If
            - ModelsNameProvided
            - !Ref ModelsBucketName
            - !Sub "${ProjectPrefix}-models-${AWS::AccountId}"
          THUMBNAILS_BUCKET: !Sub "${ProjectPrefix}-thumbnails-${AWS::AccountId}"
          FILES_TABLE: !Ref FilesTableName
          LOAD_MODELS_FROM_S3: "true"
          MEGADETECTOR_PATH: /tmp/models/mdv5a.pt
          SPECIESNET_PATH: /tmp/models/model.pt
          MEGADETECTOR_S3_KEY: !Ref MegadetectorS3Key
          SPECIESNET_S3_KEY: !Ref SpeciesnetS3Key
          DETECTION_THRESHOLD: !Ref DetectionThreshold
          SPECIES_THRESHOLD: !Ref SpeciesThreshold
          USE_NNPACK: "0"
          MPLCONFIGDIR: /tmp/matplotlib
          LOG_LEVEL: INFO
          DRY_RUN: "false"
      Policies:
        # Least-privilege (assignment 1.3): read the two shared buckets,
        # write the one shared table, write own logs. No wildcards.
        - Statement:
            - Sid: ReadUploads
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !If
                    - UploadsNameProvided
                    - !Ref UploadsBucketName
                    - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"
            - Sid: ReadModels
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !If
                    - ModelsNameProvided
                    - !Ref ModelsBucketName
                    - !Sub "${ProjectPrefix}-models-${AWS::AccountId}"
            - Sid: WriteFilesTable
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FilesTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${FilesTableName}/index/*"

  # ---- S3 -> EventBridge -> Tagger trigger ----------------------------------
  # Rule on the default event bus matching "Object Created" events emitted by
  # the uploads bucket. EventBridge invokes the tagger as the target. This
  # decouples the trigger from the bucket's single notification slot and keeps
  # the wiring in IaC (versioned, reproducible) rather than a manual CLI
  # put-bucket-notification-configuration call.
  #
  # PREREQUISITE: the uploads bucket must have EventBridge notifications
  # enabled (NotificationConfiguration.EventBridgeConfiguration: {}). That is
  # a property of the bucket and so belongs in the infra stack that owns it.
  UploadsArrivalRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectPrefix}-uploads-to-tagger"
      Description: >
        Route S3 "Object Created" events from the uploads bucket to the
        tagger Lambda (decoupled S3 trigger via EventBridge).
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !If
                - UploadsNameProvided
                - !Ref UploadsBucketName
                - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"
      Targets:
        - Id: TaggerFunctionTarget
          Arn: !GetAtt TaggerFunction.Arn

  # Allow EventBridge to invoke the tagger, scoped to this specific rule's ARN
  # (least-privilege: only this rule, not any principal, can invoke).
  TaggerEventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TaggerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UploadsArrivalRule.Arn

  # ---- Query-Tagger ---------------------------------------------------------
  # Same container image, different entry point (query_handler). Invoked
  # synchronously by the query API for find-by-uploaded-file (2.2.3). It is
  # STATELESS: it tags a transient image and returns the counts, writing
  # nothing - so its role intentionally omits DynamoDB (tighter than the
  # tagger's, a deliberate least-privilege boundary for 1.3).
  QueryTaggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectPrefix}-query-tagger"
      RetentionInDays: !Ref LogRetentionDays

  QueryTaggerFunction:
    Type: AWS::Serverless::Function
    DependsOn: QueryTaggerLogGroup
    Properties:
      FunctionName: !Sub "${ProjectPrefix}-query-tagger"
      PackageType: Image
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - aussie_ecolens_tagger.query_handler.lambda_handler
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          # No FILES_TABLE / no uploads-write: this function never persists.
          MODELS_BUCKET: !If
            - ModelsNameProvided
            - !Ref ModelsBucketName
            - !Sub "${ProjectPrefix}-models-${AWS::AccountId}"
          THUMBNAILS_BUCKET: !Sub "${ProjectPrefix}-thumbnails-${AWS::AccountId}"
          UPLOADS_BUCKET: !If
            - UploadsNameProvided
            - !Ref UploadsBucketName
            - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"
          LOAD_MODELS_FROM_S3: "true"
          MEGADETECTOR_PATH: /tmp/models/mdv5a.pt
          SPECIESNET_PATH: /tmp/models/model.pt
          MEGADETECTOR_S3_KEY: !Ref MegadetectorS3Key
          SPECIESNET_S3_KEY: !Ref SpeciesnetS3Key
          DETECTION_THRESHOLD: !Ref DetectionThreshold
          SPECIES_THRESHOLD: !Ref SpeciesThreshold
          USE_NNPACK: "0"
          MPLCONFIGDIR: /tmp/matplotlib
          LOG_LEVEL: INFO
          DRY_RUN: "false"
      Policies:
        # Tighter than the tagger: read models (lazy load) + uploads (the
        # optional S3-key input path), write own logs. NO DynamoDB.
        - Statement:
            - Sid: ReadModels
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !If
                    - ModelsNameProvided
                    - !Ref ModelsBucketName
                    - !Sub "${ProjectPrefix}-models-${AWS::AccountId}"
            - Sid: ReadUploads
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub
                - "arn:aws:s3:::${Bucket}/*"
                - Bucket: !If
                    - UploadsNameProvided
                    - !Ref UploadsBucketName
                    - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"

Outputs:
  TaggerFunctionArn:
    Description: ARN of the tagger Lambda.
    Value: !GetAtt TaggerFunction.Arn

  TaggerFunctionName:
    Description: Name of the tagger Lambda.
    Value: !Ref TaggerFunction

  UploadsArrivalRuleArn:
    Description: >
      ARN of the EventBridge rule routing upload events to the tagger.
    Value: !GetAtt UploadsArrivalRule.Arn

  QueryTaggerFunctionArn:
    Description: ARN of the query-tagger Lambda (find-by-uploaded-file).
    Value: !GetAtt QueryTaggerFunction.Arn

  QueryTaggerFunctionName:
    Description: >
      Name of the query-tagger Lambda. Give this to the query API owner as
      their TAGGER_LAMBDA_NAME for the /query-file integration.
    Value: !Ref QueryTaggerFunction

  ReferencedUploadsBucket:
    Description: Uploads bucket the tagger reads from.
    Value: !If
      - UploadsNameProvided
      - !Ref UploadsBucketName
      - !Sub "${ProjectPrefix}-uploads-${AWS::AccountId}"

  ReferencedFilesTable:
    Description: Shared DynamoDB table the tagger writes to.
    Value: !Ref FilesTableName
