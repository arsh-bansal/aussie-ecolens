AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Aussie EcoLens \u2014 Query API (Rachana) Read side of the CQRS stack:\
  \ Flask/Lambda querying Azure Cosmos DB. Fronted by an HTTP API with a Cognito JWT\
  \ authorizer (unauthenticated requests are rejected at the gateway, before reaching\
  \ the Lambda) and a single {proxy+} catch-all route so Flask owns path routing internally.\n"
Parameters:
  AppName:
    Type: String
    Default: aussie-ecolens
  CosmosEndpoint:
    Type: String
  CosmosKey:
    Type: String
    NoEcho: true
  CosmosDatabase:
    Type: String
    Default: aussie-ecolens
  CosmosContainer:
    Type: String
    Default: files
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  TaggerLambdaName:
    Type: String
    Description: Name of Arsh's tag-only Lambda for /search/by-file (2.2.3).
    Default: aussie-ecolens-query-tagger
  SnsTopicArn:
    Type: String
    Description: 'ARN of the tag-notifications SNS topic (created by the notifier
      stack). /tags/subscribe adds the user''s email to this topic with a per-tag
      filter policy (2.3.3).

      '
    Default: arn:aws:sns:ap-southeast-2:247622885425:aussie-ecolens-tag-notifications
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        COSMOS_ENDPOINT:
          Ref: CosmosEndpoint
        COSMOS_KEY:
          Ref: CosmosKey
        COSMOS_DATABASE:
          Ref: CosmosDatabase
        COSMOS_CONTAINER:
          Ref: CosmosContainer
        COGNITO_USER_POOL_ID:
          Ref: CognitoUserPoolId
        COGNITO_CLIENT_ID:
          Ref: CognitoClientId
        AWS_REGION_NAME:
          Ref: AWS::Region
        S3_BUCKET_NAME: aussie-ecolens-uploads-247622885425
        TAGGER_LAMBDA_NAME:
          Ref: TaggerLambdaName
        DYNAMODB_TABLE: aussie-ecolens-files
        SNS_TOPIC_ARN:
          Ref: SnsTopicArn
        SPECIES_ATTRIBUTE: species
Resources:
  QueryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer:
                Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience:
              - Ref: CognitoClientId
        DefaultAuthorizer: CognitoJwt
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - DELETE
        - OPTIONS
        AllowHeaders:
        - Authorization
        - Content-Type
    Metadata:
      SamResourceId: QueryApi
  QueryApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AppName}-query-api
      CodeUri: s3://aws-sam-cli-managed-default-samclisourcebucket-uskps1sqawll/ac8ff0c5923a8ea3fce9d4c21a1e86fc
      Handler: lambda_handler.handler
      Policies:
      - S3CrudPolicy:
          BucketName: aussie-ecolens-uploads-247622885425
      - S3CrudPolicy:
          BucketName: aussie-ecolens-thumbnails-247622885425
      - Statement:
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource:
            Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TaggerLambdaName}
      - DynamoDBCrudPolicy:
          TableName: aussie-ecolens-files
      - Statement:
        - Effect: Allow
          Action:
          - sns:Subscribe
          - sns:ListSubscriptionsByTopic
          Resource:
            Ref: SnsTopicArn
        - Effect: Allow
          Action:
          - sns:GetSubscriptionAttributes
          - sns:SetSubscriptionAttributes
          Resource: '*'
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: QueryApi
            Path: /{proxy+}
            Method: ANY
        Preflight:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: QueryApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
    Metadata:
      SamResourceId: QueryApiFunction
Outputs:
  QueryApiUrl:
    Description: Base URL of the Query API (give this to the frontend).
    Value:
      Fn::Sub: https://${QueryApi}.execute-api.${AWS::Region}.amazonaws.com
