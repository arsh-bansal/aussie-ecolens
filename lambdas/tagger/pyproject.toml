[project]
name = "aussie-ecolens-tagger"
version = "0.1.0"
description = "AWS Lambda containerized image+video species tagging for Aussie EcoLens"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Arsh Bansal" },
]
license = { text = "MIT" }
keywords = ["aws", "lambda", "ml", "wildlife", "megadetector", "speciesnet"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = [
    "boto3>=1.43.12",
    "megadetector==10.0.20",
    "onnx>=1.23.1",
    "onnx2torch>=1.5",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    # torch and torchvision are pulled transitively via megadetector, but
    # we declare them directly here so [tool.uv.sources] can redirect them
    # to the CPU-only PyTorch index. Since PyTorch 2.11.0 (March 2026), the
    # default aarch64 Linux wheel on PyPI bundles CUDA SBSA for Grace
    # Hopper systems — Lambda Graviton2 has no GPU, so we explicitly opt
    # into the CPU-only build via [tool.uv.sources] below.
    #
    # The 2.13 line includes the patched PyTorch export implementation.
    # The previous 2.12 combo passed all 26 ground-truth images; this minor
    # update must pass smoke_test.py with those models/images before release.
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.uv]
# Override upstream package quirks.
# - protobuf: torch/onnx pin incompatible versions; force a modern one.
# - mkl: megadetector hard-deps on Intel MKL for sys_platform != 'darwin'.
#   MKL has no arm64 wheel (it's Intel-only) and we run on Lambda Graviton.
#   "sys_platform == 'never'" effectively removes the dep on all platforms;
#   PyTorch falls back to OpenBLAS which is the arm64 default anyway.
override-dependencies = [
    "protobuf>=4.25",
    "mkl ; sys_platform == 'never'",
    # megadetector + ultralytics-yolov5 both declare opencv-python (the GUI
    # build). It ships the SAME cv2/ module as opencv-python-headless, so
    # installing both and then uninstalling one deletes the shared cv2/ dir
    # and breaks imports. We pin opencv-python-headless directly and use
    # this override to drop the GUI variant entirely, so headless owns cv2/
    # uncontested. (Headless = no X11/Qt deps, correct for Lambda.)
    "opencv-python ; sys_platform == 'never'",
]

# Pull torch + torchvision from the CPU-only index. Default torch wheels
# drag in the entire NVIDIA CUDA stack (~2GB) which we cannot use on
# Lambda (no GPU) and which has no arm64 wheels anyway. CPU-only is the
# correct production choice for inference Lambdas.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
# explicit = true: ONLY packages explicitly mapped to this index via
# [tool.uv.sources] below are pulled from here. Everything else resolves
# from PyPI. This prevents the PyTorch index from shadowing unrelated
# packages (it mirrors old versions of tqdm, sympy, etc. which would
# otherwise trigger uv's dependency-confusion protection and break the
# resolve). The sources mapping still applies transitively, so any package
# that depends on torch/torchvision also gets the CPU wheels.
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aussie_ecolens_tagger"]
